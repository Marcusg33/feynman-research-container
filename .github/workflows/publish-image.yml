name: Publish container image

# Builds the image and pushes it to the GitHub Container Registry so users can
# pull a ready-made image instead of building it themselves (2-5 minutes saved,
# and no build failures on their machine).
#
# Builds for amd64 and arm64 so Apple Silicon Macs get a native image rather
# than a slow emulated one.

on:
  push:
    branches: [main]
    # Version tags produce the semver tags below. Publishing a release from a
    # tag is deliberately NOT a separate trigger — the tag push already covers
    # it, and having both fires two identical builds for one release.
    tags: ["v*"]
    # Documentation-only changes do not change the image.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Enables building for architectures other than the runner's own.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the image name for us — GHCR rejects uppercase, and GitHub
      # usernames commonly contain it.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
